<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Embed example – Sail Kokokahi events</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    iframe { width: 100%; height: 600px; border: 0; }
    .card { border: 1px solid #ddd; border-radius: 6px; padding: 10px 14px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>Option 1: drop-in iframe</h1>
  <!-- Replace the src host with your deployed site when embedding elsewhere -->
  <iframe src="http://localhost:3000/embed/events" title="Upcoming events"></iframe>

  <h1>Option 2: custom layout using the JSON feed</h1>
  <div id="events">Loading…</div>
  <script>
    // Change BASE to e.g. "https://your-site.example.com" when used on another domain
    const BASE = '';
    const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    fetch(`${BASE}/api/public/events`)
      .then((r) => r.json())
      .then(({ events }) => {
        document.getElementById('events').innerHTML = events.length
          ? events.map((e) => `<div class="card"><strong>${esc(e.title)}</strong><br>${esc(e.date)} ${esc(e.time)} &middot; ${esc(e.location)}<p>${esc(e.description)}</p></div>`).join('')
          : 'No upcoming events.';
      })
      .catch(() => { document.getElementById('events').textContent = 'Events unavailable.'; });
  </script>
</body>
</html>
